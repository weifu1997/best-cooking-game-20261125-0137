<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ember Kitchen — a wok-fire cooking rush</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1d130c; }
  #game { position: fixed; inset: 0; margin: auto; display: block; touch-action: none; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Ember Kitchen: walk the kitchen, chop, wok, plate and serve orders before patience runs out"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
